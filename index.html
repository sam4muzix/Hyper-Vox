
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperVox by GreenmixLabs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              obsidian: {
                950: '#06070a',
                900: '#0a0b12',
                850: '#0d0e17',
                800: '#121420',
                700: '#191c2b',
                600: '#25293d',
              },
              amber: {
                glow: '#ff6b00',
                deep: '#d94600',
                light: '#ffa800',
              },
              violet: {
                glow: '#8b5cf6',
                deep: '#6d28d9',
                neon: '#a855f7',
              },
              cyan: {
                neon: '#06b6d4',
              },
              sonic: {
                red: '#ff6b00',
                yellow: '#ffa800',
                dark: '#0d0e17',
                gray: '#191c2b',
                light: '#FFFFFF'
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #050505;
        color: white;
      }
      /* Custom scrollbar for dark theme */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1E1E1E;
      }
      ::-webkit-scrollbar-thumb {
        background: #E30613;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FFED00;
      }
      .drag-region {
        -webkit-app-region: drag !important;
      }
      .no-drag-region {
        -webkit-app-region: no-drag !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lamejs": "https://esm.sh/@breezystack/lamejs@1.2.7",
    "jszip": "https://esm.sh/jszip@3.10.1"
  }
}
</script>
